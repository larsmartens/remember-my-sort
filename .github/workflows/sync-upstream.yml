name: Sync Upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HAS_XPOSED_REPO_PAT: ${{ secrets.XPOSED_REPO_PAT != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/hxreborn/remember-my-sort.git || true

      - name: Fetch upstream
        run: git fetch upstream main --tags

      - name: Check for upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" != "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream is $BEHIND commit(s) ahead"

      - name: Capture fork baseline
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -X ours || {
            git diff --name-only --diff-filter=U > conflicts.txt
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .github/workflows/*)
                  git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                gradle.properties)
                  git checkout --theirs -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
                *)
                  git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path"
                  ;;
              esac
            done < conflicts.txt
            rm -f conflicts.txt
            git add -A
            git commit --no-edit
          }

      - name: Bump fork version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          RAW_VERSION=$(grep '^version\.name=' gradle.properties | head -n 1 | cut -d= -f2- | tr -d '\r')
          BASE_VERSION=${RAW_VERSION%%-fork.*}
          BUILD_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((300000 + BUILD_COUNT))
          VERSION_NAME="${BASE_VERSION}-fork.${BUILD_COUNT}"
          TAG_NAME="v${VERSION_NAME}"
          TMP_PROPS=$(mktemp)
          grep -v '^version\.\(code\|name\)=' gradle.properties > "${TMP_PROPS}"
          printf '\nversion.code=%s\nversion.name=%s\n' "${VERSION_CODE}" "${VERSION_NAME}" >> "${TMP_PROPS}"
          mv "${TMP_PROPS}" gradle.properties
          printf 'version_code=%s\n' "${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          printf 'tag_name=%s\n' "${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version
        if: steps.check.outputs.should_release == 'true'
        run: |
          git add gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare fork release metadata"
          fi

      - name: Restore fork workflows
        if: steps.check.outputs.behind != '0'
        run: |
          git restore --source="${{ steps.base.outputs.sha }}" --staged --worktree .github/workflows || true
          if ! git diff --quiet -- .github/workflows; then
            git add .github/workflows
            git commit -m "chore: preserve fork workflows after upstream sync"
          fi

      - name: Push synced branch
        if: steps.check.outputs.should_release == 'true'
        run: git push origin main

      - name: Create and push release tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag_name }}" -m "${{ steps.version.outputs.tag_name }}"
          git push origin "${{ steps.version.outputs.tag_name }}"

      - name: Set up JDK 21
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode keystore
        if: steps.check.outputs.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          fi

      - name: Build release APK
        if: steps.check.outputs.should_release == 'true'
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload sync artifacts
        if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: remember-my-sort-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          body: Release ${{ steps.version.outputs.tag_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Mirror release to Xposed-Modules-Repo
        if: steps.check.outputs.should_release == 'true' && env.HAS_XPOSED_REPO_PAT == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Xposed-Modules-Repo/eu.hxreborn.remembermysort
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          body: Release ${{ steps.version.outputs.tag_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Report skipped Xposed mirror
        if: steps.check.outputs.should_release == 'true' && env.HAS_XPOSED_REPO_PAT != 'true'
        run: echo "::warning::XPOSED_REPO_PAT is not configured; fork release was created, but Xposed-Modules-Repo was not updated."
